<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FixMate API</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; border: 1px solid #334155; text-align: center; max-width: 420px; width: 90%; }
    h1 { color: #38bdf8; margin: 0 0 0.5rem 0; font-size: 1.75rem; }
    p { color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.5; }
    a { display: inline-block; background: #0284c7; color: #fff; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
    a:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FixMate API</h1>
    <p>Backend REST API is live and operational with PostgreSQL database integration.</p>
    <a href="/api/v1/health">Check API Health Status</a>
  </div>
</body>
</html>
